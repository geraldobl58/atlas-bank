name: atlas-bank

services:
  atlas-bank-db:
    image: postgres:16-alpine
    container_name: atlas-bank-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=atlasbankdb
    volumes:
      - atlas-bank-data:/var/lib/postgresql/data
  keycloak-db:
    image: postgres:16-alpine
    container_name: me-keycloak-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=keycloakdb
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloakdb
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

volumes:
  atlas-bank-data:
  keycloak_db_data:
