name: atlas-bank

services:
  atlas-bank-db:
    image: postgres:16-alpine
    container_name: atlas-bank-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=atlasbankdb
    volumes:
      - atlas-bank-data:/var/lib/postgresql/data

volumes:
  atlas-bank-data:
